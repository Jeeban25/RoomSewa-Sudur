<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - RoomSewa-Sudur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
  <div class="container max-w-600">
    <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white">
      <h3 class="fw-bold text-center mb-1">Create Your Account</h3>
      <p class="text-muted text-center small mb-4">Sign up to list property or start searching rooms.</p>

      <div class="alert alert-warning d-none" role="alert" data-firebase-setup></div>
      <div class="alert d-none" role="status" data-form-status></div>
      <form id="registerForm">
        <label class="form-label small fw-bold mb-2">I want to join as a:</label>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <input type="radio" class="btn-check" name="role" id="roleTenant" value="tenant" checked>
            <label class="btn btn-outline-primary w-100 py-2" for="roleTenant">Tenant / Student</label>
          </div>
          <div class="col-6">
            <input type="radio" class="btn-check" name="role" id="roleOwner" value="owner">
            <label class="btn btn-outline-primary w-100 py-2" for="roleOwner">Room Owner</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold" for="registerName">Full Name</label>
          <input id="registerName" name="name" type="text" class="form-control" autocomplete="name" required maxlength="100">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold" for="registerEmail">Email Address</label>
          <input id="registerEmail" name="email" type="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold" for="registerPhone">Phone Number</label>
          <input id="registerPhone" name="phone" type="tel" class="form-control" autocomplete="tel" required>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-bold" for="registerPassword">Password</label>
            <input id="registerPassword" name="password" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold" for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">Register Account</button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0">Already registered? <a href="login.html">Sign in</a></p>
    </div>
  </div>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
