<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - RoomSewa-Sudur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container max-w-500">
    <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 text-center bg-white">
      <div class="bg-primary-subtle text-primary rounded-circle p-3 mx-auto mb-3" style="width: 60px; height: 60px;">
        <i class="bi bi-lock-fill fs-3"></i>
      </div>
      <h4 class="fw-bold mb-2">Forgot Password?</h4>
      <p class="text-muted small mb-4">No worries! Enter your registered email address and we'll send you an instant secure link to reset your credentials.</p>
      
      <div class="alert alert-warning d-none" role="alert" data-firebase-setup></div>
      <div class="alert d-none" role="status" data-form-status></div>
      <form id="forgotPasswordForm">
        <div class="mb-3 text-start">
          <label class="form-label small fw-bold" for="resetEmail">Registered email or admin username</label>
          <input id="resetEmail" name="identifier" type="text" class="form-control" autocomplete="username" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold mb-3">Send Reset Link</button>
        <a href="login.html" class="text-decoration-none small text-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
      </form>
    </div>
  </div>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
