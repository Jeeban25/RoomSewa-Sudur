<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahendranagar Owner Dashboard - RoomSewa-Sudur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light" data-owner-dashboard>
  <nav class="navbar site-navbar">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand site-brand" href="../index.html" aria-label="RoomSewa-Sudur home">
        <span class="brand-mark" aria-hidden="true"><i class="bi bi-house-heart-fill"></i></span>
        <span><span class="site-brand-primary">RoomSewa</span><span class="site-brand-secondary">-Sudur</span></span>
      </a>
      <div class="d-flex gap-2">
        <a href="user-profile.html" class="btn btn-outline-secondary btn-sm">My Profile</a>
        <button type="button" class="btn btn-outline-secondary btn-sm" data-owner-signout>Sign out</button>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
      <div>
        <span class="badge bg-primary-subtle text-primary">Mahendranagar Owner Portal</span>
        <h1 class="h2 fw-bold mt-2 mb-1">Namaste, <span data-owner-name>Owner</span></h1>
        <p class="text-muted mb-0">Manage your Mahendranagar room listings.</p>
      </div>
      <a href="post-a-room.html" class="btn btn-primary rounded-pill">Post a Room</a>
    </div>
    <div class="alert alert-warning d-none" role="alert" data-firebase-setup></div>
    <div class="alert d-none" role="status" data-owner-status></div>
    <section class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="h5 fw-bold mb-3">My listings</h2>
          <span class="badge bg-primary-subtle text-primary" data-owner-count>0</span>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Room</th><th>Location</th><th>Rent</th><th>Review / payment status</th><th>Actions</th></tr></thead>
            <tbody data-owner-listings></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
