<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RoomSewa-Sudur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
  <div class="container">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden max-w-900 mx-auto">
      <div class="row g-0">
        <div class="col-md-6 bg-primary text-white p-5 d-flex flex-column justify-content-between">
          <div>
            <h3 class="fw-bold text-white mb-3">RoomSewa-Sudur</h3>
            <p class="opacity-90">Find student accommodation in Mahendranagar and connect directly with room owners.</p>
          </div>
          <div class="d-flex justify-content-between text-center pt-4 border-top border-white-50">
            <div><h5 class="fw-bold mb-0">Local</h5><small class="small opacity-75">Mahendranagar</small></div>
            <div><h5 class="fw-bold mb-0">Local</h5><small class="small opacity-75">Room listings</small></div>
            <div><h5 class="fw-bold mb-0">Direct</h5><small class="small opacity-75">Owner contact</small></div>
          </div>
        </div>
        <div class="col-md-6 p-4 p-md-5 bg-white">
          <h4 class="fw-bold mb-2">Welcome Back</h4>
          <p class="text-muted small mb-4">Please enter your details to sign in.</p>
          <div class="alert alert-warning d-none" role="alert" data-firebase-setup></div>
          <div class="alert d-none" role="status" data-form-status></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label small fw-bold" for="loginIdentifier">Email or admin username</label>
              <input id="loginIdentifier" name="identifier" type="text" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold" for="loginPassword">Password</label>
              <input id="loginPassword" name="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check"><input type="checkbox" class="form-check-input" id="rem" name="remember"><label class="form-check-label small" for="rem">Remember me</label></div>
              <a href="forgot-password.html" class="small text-decoration-none">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">Sign In</button>
          </form>
          <p class="text-center text-muted small mt-3 mb-0">New to RoomSewa? <a href="register.html">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
