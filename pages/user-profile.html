<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Settings - RoomSewa-Sudur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Nav -->
  <nav class="navbar navbar-expand-lg navbar-light site-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand site-brand" href="../index.html" aria-label="RoomSewa-Sudur home">
        <span class="brand-mark" aria-hidden="true"><i class="bi bi-house-heart-fill"></i></span>
        <span><span class="site-brand-primary">RoomSewa</span><span class="site-brand-secondary">-Sudur</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto fw-medium">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="find-rooms.html">Rooms</a></li>
          <li class="nav-item"><a class="nav-link" href="how-it-works.html">How It Works</a></li>
          <li class="nav-item"><a class="nav-link" href="about-us.html">About</a></li>
        </ul>
        <div class="home-nav-actions d-flex align-items-center">
          <a href="user-profile.html" class="btn btn-outline-primary rounded-pill px-3" aria-current="page">My Profile</a>
          <button type="button" class="btn btn-primary rounded-pill px-3" data-profile-signout>Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm p-4 rounded-3 bg-white text-center">
          <div class="bg-primary-subtle text-primary fw-bold rounded-circle p-3 mx-auto mb-3" style="width: 80px; height: 80px; font-size: 28px;">RS</div>
          <h5 class="fw-bold mb-1">My account</h5>
          <span class="badge bg-primary-subtle text-primary mb-3">Mahendranagar</span>
          
          <div class="list-group text-start border-0">
            <a href="user-profile.html" class="list-group-item list-group-item-action active border-0 rounded-2 mb-1"><i class="bi bi-person me-2"></i> My Profile</a>
            <a href="landlord-dashboard.html" class="list-group-item list-group-item-action border-0 rounded-2 d-none" data-profile-owner-only><i class="bi bi-list-task me-2"></i> My Listings</a>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4 rounded-3 bg-white mb-4">
          <h5 class="fw-bold mb-3">Profile Information</h5>
          <div class="alert alert-warning d-none" role="alert" data-firebase-setup></div>
          <div class="alert d-none" role="status" data-profile-status></div>
          <form id="profileForm" class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold" for="profileName">Full Name</label>
              <input id="profileName" name="name" type="text" class="form-control" autocomplete="name" maxlength="100" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold" for="profilePhone">Mobile Number</label>
              <input id="profilePhone" name="phone" type="tel" class="form-control" autocomplete="tel" required>
            </div>
            <div class="col-12">
              <label class="form-label small fw-bold" for="profileEmail">Email Address</label>
              <input id="profileEmail" name="email" type="email" class="form-control" autocomplete="email" readonly>
            </div>
            <div class="col-12">
              <button class="btn btn-primary rounded-pill px-4">Save Profile</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
