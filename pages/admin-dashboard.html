<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - RoomSewa-Sudur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light" data-admin-dashboard>
  <nav class="navbar bg-white shadow-sm">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand fw-bold text-primary" href="../index.html">RoomSewa-Sudur Admin</a>
      <div class="d-flex align-items-center gap-3">
        <span class="small text-muted" data-admin-email>Verifying admin…</span>
        <button type="button" class="btn btn-outline-secondary btn-sm" data-admin-signout>Sign out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="mb-4">
      <span class="badge bg-primary-subtle text-primary">MAHENDRANAGAR</span>
      <h1 class="h2 fw-bold mt-2">Admin Dashboard</h1>
      <p class="text-muted mb-0">Review local room listings and manage user accounts.</p>
    </div>
    <div class="alert alert-warning d-none" role="alert" data-firebase-setup></div>
    <div class="alert d-none" role="status" data-admin-status></div>

    <div class="row g-3 mb-4">
      <div class="col-sm-6">
        <div class="card border-0 shadow-sm p-3">
          <span class="text-muted small">User accounts</span>
          <strong class="h3 mb-0" data-admin-user-count>—</strong>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="card border-0 shadow-sm p-3">
          <span class="text-muted small">Room listings</span>
          <strong class="h3 mb-0" data-admin-listing-count>—</strong>
        </div>
      </div>
    </div>

    <section class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 fw-bold">Listings</h2>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Room</th><th>Area</th><th>Owner</th><th>Status</th><th>Payment / fee</th><th>Actions</th></tr></thead>
            <tbody data-admin-listings></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="card border-0 shadow-sm">
      <div class="card-body">
        <h2 class="h5 fw-bold">User accounts</h2>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Actions</th></tr></thead>
            <tbody data-admin-users></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
