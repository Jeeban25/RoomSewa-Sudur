<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Rooms - RoomSewa-Sudur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Nav -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary fs-4" href="../index.html">RoomSewa<span class="text-dark">-Sudur</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto ms-lg-4 fw-medium">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="find-rooms.html">Find Rooms</a></li>
          <li class="nav-item"><a class="nav-link" href="how-it-works.html">How It Works</a></li>
          <li class="nav-item"><a class="nav-link" href="about-us.html">About Us</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="login.html" class="btn btn-outline-primary rounded-pill px-3">Sign In</a>
          <a href="post-a-room.html" class="btn btn-primary rounded-pill px-3">+ List a Room</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header Breadcrumb -->
  <div class="bg-white border-bottom py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
          <li class="breadcrumb-item active">Find Rooms</li>
        </ol>
      </nav>
      <span class="badge bg-primary-subtle text-primary fw-semibold">MAHENDRANAGAR</span>
    </div>
  </div>

  <!-- Search Grid -->
  <div class="container my-4 flex-grow-1">
    <div class="row g-4">
      
      <!-- Filters Sidebar -->
      <aside class="col-lg-3">
        <div class="card border-0 shadow-sm rounded-3 p-3 sticky-top top-80">
          <form id="listingFilters">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-sliders me-1"></i> Filters</h5>
            <button type="reset" class="btn btn-link p-0 text-decoration-none small text-danger">Clear All</button>
          </div>

          <!-- Location Filter -->
          <div class="mb-3">
            <label class="form-label small fw-bold">Location / Area</label>
            <select class="form-select form-select-sm">
              <option selected>Mahendranagar</option>
            </select>
          </div>

          <!-- Price Range Filter -->
          <div class="mb-3">
            <label class="form-label small fw-bold">Monthly Rent (NPR)</label>
            <input type="range" class="form-range" min="0" max="150000" step="500" id="priceRange" name="maxRent" value="150000">
            <div class="d-flex justify-content-between text-muted small">
              <span>NPR 0</span>
              <output for="priceRange">NPR 150,000</output>
            </div>
          </div>

          <!-- Room Type Checkboxes -->
          <div class="mb-3">
            <label class="form-label small fw-bold">Room Type</label>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="type" value="Single Room" id="singleRoom">
              <label class="form-check-label small d-flex justify-content-between" for="singleRoom">
                Single Room
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="type" value="Shared Flat" id="sharedFlat">
              <label class="form-check-label small d-flex justify-content-between" for="sharedFlat">
                Shared Flat
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="type" value="Hostel Space" id="hostelSpace">
              <label class="form-check-label small d-flex justify-content-between" for="hostelSpace">
                Hostel Space
              </label>
            </div>
          </div>

          <!-- Amenities -->
          <div class="mb-3">
            <label class="form-label small fw-bold">Amenities</label>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenity" value="Free WiFi" id="wifi"><label class="form-check-label small" for="wifi">WiFi Connection</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenity" value="Fully Furnished" id="furnished"><label class="form-check-label small" for="furnished">Fully Furnished</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenity" value="Bike Parking" id="parking"><label class="form-check-label small" for="parking">Bike Parking</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenity" value="Attached Bathroom" id="bath"><label class="form-check-label small" for="bath">Attached Bathroom</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenity" value="Kitchen Access" id="kitchen"><label class="form-check-label small" for="kitchen">Kitchen Access</label></div>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Apply Filters</button>
          </form>
        </div>
      </aside>

      <!-- Main Listing Results -->
      <main class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">Rooms in Mahendranagar</h5>
          <div class="d-flex align-items-center gap-2">
            <span class="small text-muted text-nowrap">Sort by:</span>
            <select class="form-select form-select-sm" data-listing-sort>
              <option>Price: Low to High</option>
              <option>Price: High to Low</option>
              <option>Most Recent</option>
            </select>
          </div>
        </div>

        <div class="row g-3" data-listings></div>
        <div class="mt-3" data-listing-status role="status"></div>

      </main>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center text-md-between d-flex flex-column flex-md-row justify-content-between align-items-center">
      <p class="mb-0 small">&copy; 2026 RoomSewa-Sudur. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
